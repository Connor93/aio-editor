server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: unknown paths fall back to index.html for client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The embedded map editor is an iframe React mounts after load (MapEditor.tsx),
  # so a hard refresh of the app is a *separate* navigation from the iframe's and
  # the cache bypass never reaches it. Its filenames are stable (bundle.min.js),
  # so with no Cache-Control the browser falls back to heuristic freshness and
  # happily serves a pre-deploy editor build for days. "no-cache" still stores
  # the response -- it just forces revalidation, so unchanged builds cost a 304.
  location /eomap/ {
    add_header Cache-Control "no-cache";
  }

  # Same trap for the SPA shell: index.html names the hashed asset bundles, so a
  # stale shell pins the whole app to the previous deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
